version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethical-ai-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MODEL_PATH=/app/models/crime_predictor.pkl
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/models:/app/models
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - ethical-ai-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ethical-ai-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ethical_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ethical-ai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ethical-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ethical-ai-network
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ethical-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ethical-ai-network

volumes:
  postgres_data:
  redis_data:

networks:
  ethical-ai-network:
    driver: bridge
